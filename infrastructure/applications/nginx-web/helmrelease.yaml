apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-web
  namespace: demo
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: whoami-api
      namespace: demo
  chart:
    spec:
      chart: nginx-web
      # version is set per cluster in ./overlays/<cluster>/nginx-web.yaml
      sourceRef:
        kind: HelmRepository
        name: ghcr-charts
        namespace: flux-system
      interval: 5m
  values:
    backend:
      serviceName: whoami-api
      servicePort: 80
    imagePullSecrets:
      - name: ghcr-pull
